[project]
name = "agenthub"
version = "0.1.0"
description = "Enterprise Agent Runtime & Control Plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4,<5",
  "langgraph>=0.3,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "litellm>=1.60,<2",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.13,<1.14",
  "redis>=5.2,<6",
  "sentence-transformers>=3.4,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "torch>=2.14,<2.15",
  "transformers>=4.49,<5",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL database configured with AGENTHUB_TEST_DATABASE_URL",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
