x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prepare:
    <<: *backend
    command: ["uv", "run", "python", "-m", "scripts.local_setup", "prepare"]
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_AUTH_JWT_SECRET: ${AGENTHUB_AUTH_JWT_SECRET:?Run python -m scripts.local_setup init first}
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: api
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      AGENTHUB_AUTH_JWT_SECRET: ${AGENTHUB_AUTH_JWT_SECRET:?Run python -m scripts.local_setup init first}
      AGENTHUB_CREDENTIAL_MASTER_KEY: ${AGENTHUB_CREDENTIAL_MASTER_KEY:?Run python -m scripts.local_setup init first}
      AGENTHUB_AUTH_COOKIE_SECURE: "${AGENTHUB_AUTH_COOKIE_SECURE:-true}"
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START: "${AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START:-false}"
      AGENTHUB_MODEL_PROVIDER_PRIVATE_CIDRS: "${AGENTHUB_MODEL_PROVIDER_PRIVATE_CIDRS:-[]}"
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
      # BGE-M3 and its reranker are ~3.3GB, downloaded lazily on the first
      # retrieval. Without somewhere durable to put them, every `up --build`
      # pays for that again, and the first request after it appears to hang.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 20

  worker:
    <<: *backend
    command: ["uv", "run", "celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A apps.worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 30s
      timeout: 8s
      start_period: 10s
      retries: 3
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: worker
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      # The worker resolves provider credentials itself -- agent runs,
      # evaluation and memory extraction all decrypt here. Without the same
      # key the API encrypted with, every model call in the worker fails with
      # "Credential encryption is not configured" (`docker` is not a
      # development environment, so there is no fallback key).
      AGENTHUB_CREDENTIAL_MASTER_KEY: ${AGENTHUB_CREDENTIAL_MASTER_KEY:?Run python -m scripts.local_setup init first}
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START: "${AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START:-false}"
      AGENTHUB_MODEL_PROVIDER_PRIVATE_CIDRS: "${AGENTHUB_MODEL_PROVIDER_PRIVATE_CIDRS:-[]}"
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
      # Ingestion runs here, so the worker is usually the process that pays
      # the model download. Same cache as the API: one copy, not two.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["uv", "run", "celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=INFO"]
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: beat
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
    depends_on:
      prepare:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  agenthub_blobs:
  hf_cache:
