services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: api
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      AGENTHUB_AUTH_JWT_SECRET: ${AGENTHUB_AUTH_JWT_SECRET:?AGENTHUB_AUTH_JWT_SECRET is required}
      AGENTHUB_CREDENTIAL_MASTER_KEY: ${AGENTHUB_CREDENTIAL_MASTER_KEY:?AGENTHUB_CREDENTIAL_MASTER_KEY is required}
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      # The first `search_knowledge` of a process loads BGE-M3 and the
      # cross-encoder, which took ~35s here -- longer than the 30s a tool call
      # is given, so the first retrieval after every deploy failed with
      # TOOL_TIMEOUT. Load them at start instead, off the request path.
      AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START: "true"
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    ports:
      - "8000:8000"
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
      # BGE-M3 and its reranker are ~3.3GB, downloaded lazily on the first
      # retrieval. Without somewhere durable to put them, every `up --build`
      # pays for that again, and the first request after it appears to hang.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["uv", "run", "celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: worker
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      # The worker resolves provider credentials itself -- agent runs,
      # evaluation and memory extraction all decrypt here. Without the same
      # key the API encrypted with, every model call in the worker fails with
      # "Credential encryption is not configured" (`docker` is not a
      # development environment, so there is no fallback key).
      AGENTHUB_CREDENTIAL_MASTER_KEY: ${AGENTHUB_CREDENTIAL_MASTER_KEY:?AGENTHUB_CREDENTIAL_MASTER_KEY is required}
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      # The first `search_knowledge` of a process loads BGE-M3 and the
      # cross-encoder, which took ~35s here -- longer than the 30s a tool call
      # is given, so the first retrieval after every deploy failed with
      # TOOL_TIMEOUT. Load them at start instead, off the request path.
      AGENTHUB_KNOWLEDGE_WARM_MODELS_ON_START: "true"
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
      # Ingestion runs here, so the worker is usually the process that pays
      # the model download. Same cache as the API: one copy, not two.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["uv", "run", "celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=INFO"]
    environment:
      AGENTHUB_ENVIRONMENT: docker
      AGENTHUB_PROCESS_ROLE: beat
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      AGENTHUB_REDIS_URL: redis://redis:6379/0
      AGENTHUB_QDRANT_URL: http://qdrant:6333
      AGENTHUB_BLOB_ROOT: /var/lib/agenthub/blobs
    volumes:
      - agenthub_blobs:/var/lib/agenthub/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  agenthub_blobs:
  hf_cache:
