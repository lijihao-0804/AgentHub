services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?Run the portfolio init command first}
      POSTGRES_DB: agenthub_portfolio_test
    ports:
      - "127.0.0.1:56416:5432"
    volumes:
      - portfolio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d agenthub_portfolio_test"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56417:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  portfolio_pg:
