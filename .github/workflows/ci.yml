name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AGENTHUB_TEST_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@localhost:5432/agenthub_test
      AGENTHUB_DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@localhost:5432/agenthub_test
      AGENTHUB_TEST_REDIS_URL: redis://localhost:6379/0
      AGENTHUB_REDIS_URL: redis://localhost:6379/0
      AGENTHUB_TEST_QDRANT_URL: http://localhost:6333
      AGENTHUB_QDRANT_URL: http://localhost:6333
      AGENTHUB_TESTING: "true"
      AGENTHUB_BLOB_ROOT: data/blobs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agenthub_test
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Wait for Qdrant
        run: |
          uv run --locked python - <<'PY'
          import time
          import httpx

          deadline = time.monotonic() + 60
          with httpx.Client(timeout=2) as client:
              while time.monotonic() < deadline:
                  try:
                      response = client.get("http://localhost:6333/healthz")
                      if response.is_success:
                          break
                  except httpx.HTTPError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit("Qdrant did not become ready")
          PY
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - name: Bootstrap LangGraph checkpoint schema
        run: >-
          uv run --locked python -m scripts.bootstrap_langgraph_checkpoint
          --database-url "$AGENTHUB_TEST_DATABASE_URL"
      - run: uv run --locked ruff check .
      - name: Start Celery worker
        run: |
          uv run --locked python -m tests.support.celery_worker > celery-worker.log 2>&1 &
          echo $! > celery-worker.pid
          sleep 3
      - name: Run all integration tests
        run: uv run --locked pytest -m integration -vv -rs
      - name: Run M7-A evaluation dataset integration
        run: uv run --locked pytest tests/integration/test_m7a_evaluation_datasets.py -vv -rs
      - name: Run M7-B experiment persistence integration
        run: uv run --locked pytest tests/integration/test_m7b_experiments.py -vv -rs
      - name: Validate M3 retrieval benchmark wiring
        run: |
          uv run --locked python -m benchmarks.retrieval.runner --validate-only
          uv run --locked pytest tests/unit/test_retrieval_benchmark.py -vv
      - name: Validate M4 agent evaluation dataset
        run: uv run --locked python -m benchmarks.agent_runtime.runner --validate-only
      - name: Run M4 agent runtime evaluation baseline
        run: >-
          uv run --locked python -m benchmarks.agent_runtime.runner
          --database-url "$AGENTHUB_TEST_DATABASE_URL"
          --output "$RUNNER_TEMP/m4-agent-runtime-result.json"
          --summary "$RUNNER_TEMP/m4-agent-runtime-summary.md"
      - name: Run M5 approval runtime evaluation
        run: >-
          uv run --locked python -m benchmarks.approval_runtime.runner
          --output "$RUNNER_TEMP/m5-approval-runtime-result.json"
      - name: Validate M6 observability failure dataset
        run: uv run --locked python -m benchmarks.observability.runner --validate-only
      - name: Generate M6 observability failure dataset through runtime
        run: uv run --locked pytest tests/integration/test_m6b_failure_dataset_runtime.py -vv -rs
      - name: Stop Celery worker
        if: always()
        run: |
          if [ -f celery-worker.pid ]; then kill "$(cat celery-worker.pid)" || true; fi
          if [ -f celery-worker.log ]; then cat celery-worker.log; fi
      - run: uv run --locked pytest -m "not integration"
      - name: Validate M7-A dataset contract
        run: uv run --locked pytest tests/unit/test_m7a_dataset_validation.py -vv
      - name: Validate M7-B reproducibility contract
        run: >-
          uv run --locked pytest tests/unit/test_m7b_reproducibility.py
          tests/unit/test_m7b_evaluation_api.py -vv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
